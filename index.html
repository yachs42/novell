<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Голос в проводах</title>

<!-- ▼ Шрифты Google Fonts ▼ -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;600&family=Rajdhani:wght@400;500;600;700&display=swap" rel="stylesheet">

<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- ==================== ГЛАВНОЕ МЕНЮ ==================== -->
<div id="menuScreen" class="screen">
  <h1 class="title">ГОЛОС<span> В </span>ПРОВОДАХ</h1>
  <p class="subtitle">научная фантастика · киберпанк · этическая драма</p>
  <div class="menu-buttons">
  <button class="btn" id="btnContinue" onclick="continueGame()">Продолжить</button>
  <button class="btn" onclick="newGame()">Новая игра</button>
  <button class="btn" onclick="openSlots('load')">Загрузить сохранение</button>
  <button class="btn magenta" onclick="exitGame()">Выход</button>
</div>
  <div class="menu-footer">ОРАКУЛ · СИСТЕМА ГОРОДСКОГО УПРАВЛЕНИЯ · v4.12</div>
</div>

<!-- ==================== ИГРА ==================== -->
<div id="gameScreen" class="screen hidden">

  <!-- ▼▼▼ ВИЗУАЛЬНЫЙ СЛОЙ: фон и персонажи ▼▼▼ -->
  <div class="visuals" id="visuals">
    <div class="bg-layer" id="bgLayer"></div>
    <div class="char-layer" id="charLayer"></div>
  </div>
  <!-- ▲▲▲ /ВИЗУАЛЬНЫЙ СЛОЙ ▲▲▲ -->

  <div class="hud">
    <div class="stat"><span class="lbl">Эмпатия</span><div class="bar emp"><i id="barEmp"></i></div><span class="num" id="numEmp">0</span></div>
    <div class="stat"><span class="lbl">Доверие</span><div class="bar trs"><i id="barTrs"></i></div><span class="num" id="numTrs">0</span></div>
    <div class="stat"><span class="lbl">Риск</span><div class="bar rsk"><i id="barRsk"></i></div><span class="num" id="numRsk">0</span></div>
    <div class="hud-right">
  <button class="mini" id="btnBack" onclick="goBack()">← Назад</button>
  <button class="mini" onclick="openSlots('save')">Сохранить</button>
  <button class="mini" onclick="toggleStoryMap()">🗺 Карта</button>
  <button class="mini" onclick="toMenu()">Меню</button>
</div>
  </div>

  <div class="stage" id="stage">
    <div class="node-title" id="nodeTitle"></div>
    <div class="node-text" id="nodeText"></div>
    <div class="choices" id="choices"></div>
    <div id="endingBox"></div>
  </div>
</div>

<script src="script.js"></script>
</body>
</html>
